[package]
name = "sysaug"
version = "0.2.0"
authors = ["Zhongzhi Yu <7296488+markzyu@users.noreply.github.com>"]
license = "LGPL-3.0-or-later"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
executor = {path = "../executor"}
procfs = {path = "../procfs"}
ptrace = {path = "../ptrace"}
lazy_static = "1.4.0"
libc = "0.2.80"
nix = "0.30.1"
elf = "0.0.10"
futures-lite = "2.6.1"
serde_json = "1.0"
serde_with = "3.0"
thiserror = "1.0.25"
tracing = "0.1.26"

[dependencies.serde]
version = "1.0.118"
features = ["derive"]