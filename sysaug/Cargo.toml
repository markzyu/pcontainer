[package]
name = "sysaug"
version = "0.2.0"
authors = ["Zhongzhi Yu <7296488+markzyu@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
edition = "2024"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
executor = {path = "../executor"}
procfs = {path = "../procfs"}
ptrace = {path = "../ptrace"}
lazy_static = "1.4.0"
libc = "0.2.189"
nix = {version = "0.30.1", features = ["feature"]}
elf = "0.0.10"
futures-lite = "2.6.1"
regex = "1.13.1"
serde_json = "1.0"
serde_regex = "1.2.0"
thiserror = "1.0.25"
tracing = "0.1.26"

[dependencies.serde]
version = "1.0.118"
features = ["derive"]